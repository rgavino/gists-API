name: CI

on:
  push:
    branches: [solution]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default; jobs calling deploy.yml add packages: write.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: gists-api:${{ github.sha }}

jobs:
  # Fastest checks first, so mistakes fail in seconds.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # --exit-zero so findings still get uploaded; the lint step below is the gate.
      - name: Generate Ruff SARIF report
        run: pipx run ruff check --exit-zero --output-format=sarif --output-file=ruff.sarif .
      # Pull requests from forks get a read-only token and can't upload.
      - name: Upload Ruff results to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ruff.sarif
          category: ruff
      - name: Lint Python (includes SAST)
        run: pipx run ruff check --output-format=github .
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests (fake GitHub API)
        run: python -m unittest -v
        env:
          SKIP_INTEGRATION: "1"
      - name: Unit tests with coverage
        run: |
          python -m pip install coverage==7.17.0
          python -m coverage run --branch --source=app -m unittest -v
          python -m coverage report -m --fail-under=80
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
        env:
          SKIP_INTEGRATION: "1"

  # Calls the real GitHub API, so it can fail for reasons outside our control
  # (outage, rate limit). It reports, but does not block the build.
  # Unauthenticated: the Actions token is an app token, which GitHub rejects
  # on the user gists endpoint with a 403.
  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Integration test (real GitHub API)
        run: python -m unittest -v

  build:
    needs: [lint, test]
    # Publishing needs the self-hosted runner, which can reach localhost:5000.
    # Pull requests never publish, so their code stays off that machine.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash # a Windows runner would otherwise use PowerShell
    env:
      # The self-hosted runner persists between runs, so names must not clash.
      CONTAINER: gists-api-ci-${{ github.run_id }}
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t "$IMAGE" .

      # The test stage sits on the runtime layers, so the tests run against the
      # shipped image without test files being left in it.
      - name: Unit tests inside the image
        run: docker build --target test .

      - name: Start container
        run: docker run -d --name "$CONTAINER" -p 8080:8080 "$IMAGE"

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          echo
          curl -fsS http://localhost:8080/healthz | grep -q '"ok"'
          # Invalid username is rejected without calling GitHub.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/not--valid)" = "404"

      - name: Container logs
        if: always()
        run: docker logs "$CONTAINER" || true

      - name: Remove container
        if: always()
        run: docker rm -f "$CONTAINER" || true

      # Only pushes and manual runs publish; pull requests stop at CI.
      - name: Push image to local registry
        id: push
        if: github.event_name != 'pull_request'
        run: |
          repo="localhost:5000/gists-api"
          docker tag "$IMAGE" "$repo:${{ github.sha }}"
          docker push "$repo:${{ github.sha }}"
          # Deploys pull by digest, so a re-pushed tag can't change what ships.
          # The image also carries a digest under its local name, so pick the registry one.
          ref=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$repo:${{ github.sha }}" | grep -m1 "^$repo@")
          echo "image=$ref" >> "$GITHUB_OUTPUT"

  # CD: the image built above is promoted unchanged, DEV first, then UAT.
  deploy-dev:
    needs: build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: dev
      image: ${{ needs.build.outputs.image }}
    secrets: inherit

  # Waits for approval if the uat environment has required reviewers.
  deploy-uat:
    needs: [build, deploy-dev]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: uat
      image: ${{ needs.build.outputs.image }}
    secrets: inherit

    # Waits for approval if the prd environment has required reviewers.
  deploy-prd:
    needs: [build, deploy-uat]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: prd
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
